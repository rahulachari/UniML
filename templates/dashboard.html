<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | UniML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .navbar-custom {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .card-option {
            width: 260px;
            height: 200px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.4s ease;
            cursor: pointer;
        }

        .card-option:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 50px;
        }

        .main-container {
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        a.card-link {
            text-decoration: none;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/dashboard">UniML</a>
    <div class="ms-auto">
        <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Home</a>
        <a href="/" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="main-container">
    <div class="text-center">
        <h2 class="mb-5">Multi-Domain Intelligent Platform</h2>

        <div class="d-flex justify-content-center gap-4">

            <!-- ✅ EDUCATION (FIXED) -->
            <a href="/education" class="card-link">
                <div class="card-option d-flex flex-column justify-content-center align-items-center">
                    <div class="icon">🎓</div>
                    <h5>Education</h5>
                    <small>Active</small>
                </div>
            </a>

            <!-- ✅ HEALTHCARE -->
            <a href="/healthcare" class="card-link">
                <div class="card-option d-flex flex-column justify-content-center align-items-center">
                    <div class="icon">🏥</div>
                    <h5>Healthcare</h5>
                    <small>Active</small>
                </div>
            </a>

            <!-- ⚠️ BANKING (NOT ACTIVE YET) -->
             <a href="/banking" class="card-link">
            <div class="card-option d-flex flex-column justify-content-center align-items-center">
                <div class="icon">🏦</div>
                <h5>Banking</h5>
                <small>active</small>
            </div>
             </a>
        </div>
    </div>
</div>

</body>
</html>
