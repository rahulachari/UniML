<!DOCTYPE html>
<html>
<head>
    <title>Resume ATS Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
.nav-buttons {
    position: fixed;
    top: 15px;
    right: 20px;
    z-index: 999;
}

.nav-buttons button {
    margin-left: 8px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #1abc9c;
    color: white;
    cursor: pointer;
    font-weight: 500;
}

.nav-buttons button:hover {
    background: #16a085;
}
        body {
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            max-width: 600px;
            margin: auto;
            margin-top: 80px;
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-control {
            background: rgba(255,255,255,0.9);
            border: none;
        }

        .btn-custom {
            background: linear-gradient(90deg,#00c6ff,#0072ff);
            border: none;
            color: white;
            font-weight: 500;
        }

        .btn-custom:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="nav-buttons">
    <button onclick="goBack()">⬅ Back</button>
    <a href="/dashboard"><button>🏠 Home</button></a>
</div>

<div class="container-box text-center">

    <h2 class="mb-4">Resume ATS Analyzer</h2>

    <form action="/process_education" method="POST" enctype="multipart/form-data">

    <input type="file" name="resume" class="form-control mb-3" required>

    <select name="domain" class="form-control mb-4" required>
        <option value="">Select Role Type</option>
        <option value="it">IT</option>
        <option value="non_it">Non-IT</option>
        <option value="management">Management</option>
    </select>

    <button type="submit" class="btn btn-custom w-100">
        Analyze Resume
    </button>

</form>

</div>

</body>
<script>
function goBack() {
    window.history.back();
}
</script>
</html>
