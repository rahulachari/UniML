<!DOCTYPE html>
<html>
<head>
    <title>Healthcare | UniML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1d4350, #a43931);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .navbar-custom {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .upload-card {
            width: 500px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 40px;
            text-align: center;
        }

        .main-container {
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-analyze {
            background-color: #ff6a00;
            border: none;
        }

        .btn-analyze:hover {
            background-color: #ff3c00;
        }
.nav-buttons {
    position: fixed;
    top: 15px;
    right: 20px;
    z-index: 999;
}

.nav-buttons button {
    margin-left: 8px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #1abc9c;
    color: white;
    cursor: pointer;
    font-weight: 500;
}

.nav-buttons button:hover {
    background: #16a085;
}
    </style>
</head>

<body>
<div class="nav-buttons">
    <button onclick="goBack()">⬅ Back</button>
    <a href="/dashboard"><button>🏠 Home</button></a>
</div>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/dashboard">UniML</a>
    <div class="ms-auto">
        <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
        <a href="/" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="main-container">
    <div class="upload-card shadow-lg">
        <h3 class="mb-4">Healthcare Report Analysis</h3>

        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="report" accept=".jpg" class="form-control mb-3" required>
            <button class="btn btn-analyze w-100">Analyze Report</button>
        </form>
    </div>
</div>

</body>
<script>
function goBack() {
    window.history.back();
}
</script>
</html>
