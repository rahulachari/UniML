<!DOCTYPE html>
<html>
<head>
    <title>Sign Up | UniML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .card {
            width: 400px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            animation: slideUp 0.8s ease-in-out;
        }

        .form-control {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: #ddd;
        }

        .form-control:focus {
            box-shadow: none;
            background: rgba(255,255,255,0.3);
        }

        .btn-custom {
            background-color: #00ffcc;
            border: none;
            transition: 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #00cc99;
            transform: scale(1.05);
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes slideUp {
            from {opacity: 0; transform: translateY(40px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="card p-4 shadow-lg">
    <h3 class="text-center mb-4">Create UniML Account</h3>

    <form method="post">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Choose Username" required>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Create Password" required>
        </div>

        <div class="d-grid">
            <button class="btn btn-custom">Register</button>
        </div>
    </form>

    <p class="text-center mt-3">
        Already have an account? <a href="/">Login here</a>
    </p>
</div>

</body>
</html>
